<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUYMA目利き判定</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #2b2b2b;
    --accent: #b0413e;
    --muted: #8a8578;
    --line: #e5e0d5;
    --good: #2e7d32;
    --warn: #b26a00;
    --bad: #c62828;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 720px; margin: 0 auto; padding: 0 12px 60px;
  }
  header { padding: 20px 4px 12px; }
  header h1 { font-size: 1.25rem; letter-spacing: .02em; }
  header p { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  nav { display: flex; gap: 6px; margin: 10px 0 16px; }
  nav button {
    flex: 1; padding: 10px 4px; border: 1px solid var(--line);
    background: var(--card); border-radius: 8px; font-size: .9rem;
    cursor: pointer; color: var(--muted);
  }
  nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  section { display: none; }
  section.active { display: block; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 12px;
  }
  label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 1rem; background: #fff;
  }
  button.primary {
    width: 100%; margin-top: 16px; padding: 12px; border: none;
    background: var(--accent); color: #fff; border-radius: 8px;
    font-size: 1rem; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; }
  .drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 36px 16px;
    text-align: center; color: var(--muted); cursor: pointer;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .status { margin-top: 12px; font-size: .9rem; white-space: pre-wrap; }
  .status.ok { color: var(--good); }
  .status.err { color: var(--bad); }
  .result { border-left: 4px solid var(--line); }
  .result h3 { font-size: 1rem; margin-bottom: 4px; }
  .verdict { font-size: 1.1rem; font-weight: bold; margin: 6px 0; }
  .verdict.v-good { color: var(--good); }
  .verdict.v-mid { color: var(--warn); }
  .verdict.v-bad { color: var(--bad); }
  .result ul { margin: 6px 0 0 1.2em; font-size: .85rem; color: #4a4a4a; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; margin-top: 8px; }
  .kv span b { font-weight: 600; }
  .profit { margin-top: 8px; padding: 8px 10px; background: #f2f7f2; border-radius: 6px; font-size: .9rem; }
  .profit.none { background: #f7f4ec; color: var(--muted); }
  .tagrow { margin-top: 6px; }
  .tag {
    display: inline-block; font-size: .7rem; background: #eee9dd;
    border-radius: 4px; padding: 2px 7px; margin-right: 4px; color: #6b6350;
  }
  .searchbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .searchbar input { flex: 1; }
  .searchbar button {
    padding: 0 20px; border: none; background: var(--accent); color: #fff;
    border-radius: 8px; font-size: .95rem; cursor: pointer;
  }
  .empty { color: var(--muted); text-align: center; padding: 24px; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>BUYMA 目利き判定</h1>
  <p>蓄積した出品データから「買い」を判定します</p>
</header>

<nav>
  <button data-tab="search" class="active">検索</button>
  <button data-tab="upload">動画アップロード</button>
  <button data-tab="cost">原価入力</button>
</nav>

<!-- 検索タブ -->
<section id="tab-search" class="active">
  <div class="searchbar">
    <input id="q" type="search" placeholder="商品名・型番・ブランドで検索">
    <button onclick="doSearch()">検索</button>
  </div>
  <div id="search-results"><div class="empty">キーワードを入力して検索（空欄で全件表示）</div></div>
</section>

<!-- アップロードタブ -->
<section id="tab-upload">
  <div class="card">
    <div class="drop" id="drop">
      <p>ここに録画ファイル(mp4)をドラッグ＆ドロップ<br>またはタップして選択</p>
      <input id="file" type="file" accept="video/*" hidden>
    </div>
    <div class="status" id="up-status"></div>
  </div>
  <div class="card" style="font-size:.8rem;color:var(--muted)">
    BUYMA検索結果（人気順）をスクロール録画した動画をアップロードすると、
    フレーム抽出 → 画像解析 → データベース反映まで自動で実行します。
    動画の長さによって数分かかることがあります。
  </div>
</section>

<!-- 原価入力タブ -->
<section id="tab-cost">
  <div class="card">
    <label>商品</label>
    <select id="c-product"></select>
    <label>買付日</label>
    <input id="c-date" type="date">
    <label>現地価格</label>
    <input id="c-price" type="number" step="0.01" placeholder="例: 250">
    <label>通貨</label>
    <select id="c-currency">
      <option>EUR</option><option>USD</option><option>GBP</option><option>JPY</option>
    </select>
    <label>為替レート（1通貨 = 円）</label>
    <input id="c-rate" type="number" step="0.01" placeholder="例: 165.5">
    <label>購入店舗</label>
    <input id="c-store" type="text" placeholder="例: PRADA ミラノ本店">
    <label>都市</label>
    <input id="c-city" type="text" placeholder="例: Milano">
    <label>VAT還付見込み額（円）</label>
    <input id="c-vat" type="number" value="0">
    <button class="primary" onclick="savePurchase()">保存</button>
    <div class="status" id="c-status"></div>
  </div>
</section>

<script>
// ---- タブ切り替え ----
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("section").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("tab-" + b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "cost") loadProducts();
  });
});

// ---- 検索 ----
async function doSearch() {
  const q = document.getElementById("q").value.trim();
  const box = document.getElementById("search-results");
  box.innerHTML = '<div class="empty">検索中...</div>';
  const res = await fetch("/api/search?q=" + encodeURIComponent(q));
  const data = await res.json();
  if (!data.results.length) {
    box.innerHTML = '<div class="empty">該当する商品がありません</div>';
    return;
  }
  box.innerHTML = data.results.map(renderResult).join("");
}
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

function yen(n) { return n == null ? "—" : "¥" + n.toLocaleString(); }

function renderResult(r) {
  const vClass = r.verdict === "◎" ? "v-good" : (r.verdict === "○" ? "v-mid" : "v-bad");
  let profitHtml;
  if (r.cost_jpy != null && r.profit != null) {
    const sign = r.profit >= 0 ? "+" : "";
    profitHtml = `<div class="profit">【見込み利益】 ${sign}${yen(r.profit)}（利益率 ${r.profit_rate}%）<br>
      想定原価 ${yen(r.cost_jpy)} / 販売想定 ${yen(r.recent_avg_price || r.avg_price)}（手数料控除後で試算）</div>`;
  } else {
    profitHtml = `<div class="profit none">原価未入力 — 原価を入力すると利益試算が可能になります</div>`;
  }
  return `<div class="card result">
    <h3>${esc(r.brand)} ${esc(r.item_name)}${r.model_code ? " (" + esc(r.model_code) + ")" : ""}</h3>
    <div style="font-size:.75rem;color:var(--muted)">${esc(r.category)} ／ 観測${r.observation_count}回</div>
    <div class="verdict ${vClass}">判定: ${r.verdict_label} ${r.verdict}</div>
    <b style="font-size:.85rem">【根拠】</b>
    <ul>${r.reasons.map(x => "<li>" + esc(x) + "</li>").join("")}</ul>
    <div class="kv">
      <span>平均価格 <b>${yen(r.avg_price)}</b></span>
      <span>直近平均 <b>${yen(r.recent_avg_price)}</b></span>
      <span>平均割引率 <b>${r.avg_discount != null ? r.avg_discount + "%" : "—"}</b></span>
      <span>出品者数 <b>${r.seller_count}</b></span>
      <span>評価 <b>${r.max_review_count}件</b></span>
    </div>
    ${r.tags.length ? `<div class="tagrow">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${profitHtml}
  </div>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---- アップロード ----
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

async function uploadFile(file) {
  const st = document.getElementById("up-status");
  st.className = "status";
  st.textContent = "アップロード中... (" + file.name + ")";
  const fd = new FormData();
  fd.append("file", file);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: fd });
    if (!res.ok) throw new Error("アップロードに失敗しました");
    const { job_id } = await res.json();
    st.textContent = "解析中... フレーム抽出と画像認識を実行しています（数分かかることがあります）";
    pollJob(job_id, st);
  } catch (e) {
    st.className = "status err";
    st.textContent = e.message;
  }
}

function pollJob(jobId, st) {
  const timer = setInterval(async () => {
    const res = await fetch("/api/jobs/" + jobId);
    const job = await res.json();
    if (job.status === "done") {
      clearInterval(timer);
      st.className = "status ok";
      st.textContent = "完了: " + job.message;
    } else if (job.status === "error") {
      clearInterval(timer);
      st.className = "status err";
      st.textContent = "エラー: " + job.message;
    }
  }, 3000);
}

// ---- 原価入力 ----
async function loadProducts() {
  const sel = document.getElementById("c-product");
  const res = await fetch("/api/products");
  const data = await res.json();
  sel.innerHTML = data.products.length
    ? data.products.map(p =>
        `<option value="${p.product_id}">${esc(p.brand)} ${esc(p.item_name)}${p.model_code ? " (" + esc(p.model_code) + ")" : ""}</option>`
      ).join("")
    : '<option value="">（商品がありません — 先に動画を投入してください）</option>';
}

async function savePurchase() {
  const st = document.getElementById("c-status");
  const pid = document.getElementById("c-product").value;
  if (!pid) { st.className = "status err"; st.textContent = "商品を選択してください"; return; }
  const fd = new FormData();
  fd.append("product_id", pid);
  fd.append("purchase_date", document.getElementById("c-date").value);
  fd.append("purchase_price_local", document.getElementById("c-price").value);
  fd.append("currency", document.getElementById("c-currency").value);
  fd.append("exchange_rate", document.getElementById("c-rate").value);
  fd.append("store_name", document.getElementById("c-store").value);
  fd.append("city", document.getElementById("c-city").value);
  fd.append("vat_refund_expected", document.getElementById("c-vat").value || 0);
  const res = await fetch("/api/purchases", { method: "POST", body: fd });
  if (res.ok) {
    const data = await res.json();
    st.className = "status ok";
    st.textContent = `保存しました（円換算原価: ¥${data.purchase_price_jpy.toLocaleString()}）`;
  } else {
    st.className = "status err";
    st.textContent = "保存に失敗しました。入力内容を確認してください。";
  }
}

// 初期表示: 全件検索
doSearch();
</script>
</body>
</html>
